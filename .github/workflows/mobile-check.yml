name: Check Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  workflow_dispatch:

concurrency:
  group: mobile-check-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.previous-run.outputs.result }}
    steps:
      - name: Check for a successful run of this SHA
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return true;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-check.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            return !runs.some((run) =>
              run.id !== context.runId && run.conclusion === 'success'
            );

  check:
    needs: deduplicate
    if: needs.deduplicate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Jest
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

      - name: Cache Expo Android prebuild
        id: expo-prebuild-cache
        uses: actions/cache@v4
        with:
          path: mobile/android
          key: expo-android-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/plugins/**', 'mobile/native-android/**', 'mobile/lsposed/src/main/**') }}

      - name: Prebuild Android
        if: steps.expo-prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble merged release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --build-cache --no-daemon

      - name: Verify embedded Xposed sources and metadata
        run: |
          test -f android/app/src/main/java/com/monkeycode/hook/ModuleMain.kt
          test -f android/app/src/main/java/com/monkeycode/hook/XposedServiceBridge.kt
          test -f android/app/src/main/resources/META-INF/xposed/java_init.list
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/java_init.list'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/module.prop'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/scope.list'
          grep -F 'android.compileSdkVersion=37' android/gradle.properties
