name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/prepare_android_sandbox.sh'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.previous-run.outputs.result }}
    steps:
      - name: Check for a successful run of this SHA
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return true;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-build.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            return !runs.some((run) =>
              run.id !== context.runId && run.conclusion === 'success'
            );

  build:
    needs: deduplicate
    if: needs.deduplicate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prepare Linux sandbox assets
        run: bash ../scripts/prepare_android_sandbox.sh

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Kotlin compile gate
        working-directory: mobile/android
        run: ./gradlew :app:compileReleaseKotlin --build-cache --no-daemon

      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --build-cache --no-daemon

      - name: Verify embedded Xposed metadata
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/java_init.list'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/module.prop'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'META-INF/xposed/scope.list'

      - name: Assign unique APK name
        run: cp android/app/build/outputs/apk/release/app-release.apk "MonkeyCode-mobile-agent-lsposed-${GITHUB_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-mobile-${{ github.sha }}
          path: mobile/MonkeyCode-mobile-agent-lsposed-${{ github.sha }}.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: monkeycode-mobile-${{ github.sha }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Mobile Build ${{ github.run_number }}
          tag_name: mobile-build-${{ github.run_number }}
          files: artifacts/MonkeyCode-mobile-agent-lsposed-${{ github.sha }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
