name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build LSPosed module
        working-directory: mobile/lsposed
        run: |
          chmod +x ../../gradlew
          ../../gradlew :lsposed:assembleRelease

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload LSPosed module
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-lsposed
          path: mobile/lsposed/build/outputs/apk/release/lsposed-release.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monkeycode-apk
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: monkeycode-lsposed
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mobile Build ${{ github.run_number }}"
          tag_name: "mobile-build-${{ github.run_number }}"
          files: |
            artifacts/app-release.apk
            artifacts/lsposed-release.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}