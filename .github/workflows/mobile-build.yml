name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  build-lsposed:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle (LSPosed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/lsposed/build
          key: lsposed-gradle-${{ runner.os }}-${{ hashFiles('mobile/lsposed/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            lsposed-gradle-${{ runner.os }}-

      - name: Build LSPosed module
        working-directory: mobile/lsposed
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload LSPosed module
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-lsposed
          path: mobile/lsposed/build/outputs/apk/release/*.apk

  release:
    needs: [build, build-lsposed]
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monkeycode-apk
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: monkeycode-lsposed
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Check APK exists
        run: |
          ls -la artifacts/
          if [ ! -f "artifacts/app-release.apk" ]; then
            echo "APK not found, aborting release"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mobile Build ${{ github.run_number }}"
          tag_name: "mobile-build-${{ github.run_number }}"
          files: artifacts/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}