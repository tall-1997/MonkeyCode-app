name: Build Mobile LSPosed API 102

on:
  push:
    branches: [main]
    paths:
      - 'mobile/lsposed/**'
      - '.github/workflows/mobile-lsposed.yml'
  pull_request:
    paths:
      - 'mobile/lsposed/**'
      - '.github/workflows/mobile-lsposed.yml'
  workflow_dispatch:

concurrency:
  group: mobile-lsposed-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.previous-run.outputs.result }}
    steps:
      - name: Check for a successful run of this SHA
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return true;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-lsposed.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            return !runs.some((run) =>
              run.id !== context.runId && run.conclusion === 'success'
            );

  build:
    needs: deduplicate
    if: needs.deduplicate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile LSPosed API 102 module
        working-directory: mobile/lsposed
        run: ./gradlew compileReleaseKotlin --build-cache --no-daemon

      - name: Assemble LSPosed API 102 module
        working-directory: mobile/lsposed
        run: ./gradlew assembleRelease --build-cache --no-daemon

      - name: Assign unique APK name
        shell: bash
        run: |
          shopt -s nullglob
          apks=(mobile/lsposed/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "mobile/lsposed/MonkeyCode-lsposed-api102-${GITHUB_SHA}.apk"

      - name: Upload LSPosed APK
        uses: actions/upload-artifact@v4
        with:
          name: monkeycode-lsposed-api102-${{ github.sha }}
          path: mobile/lsposed/MonkeyCode-lsposed-api102-${{ github.sha }}.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Download LSPosed APK
        uses: actions/download-artifact@v4
        with:
          name: monkeycode-lsposed-api102-${{ github.sha }}
          path: artifacts

      - name: Create LSPosed release
        uses: softprops/action-gh-release@v2
        with:
          name: LSPosed API 102 Build ${{ github.run_number }}
          tag_name: mobile-lsposed-${{ github.run_number }}
          files: artifacts/MonkeyCode-lsposed-api102-${{ github.sha }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
