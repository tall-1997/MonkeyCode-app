name: Verify Embedded LSPosed API 102

on:
  workflow_dispatch:

concurrency:
  group: mobile-lsposed-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.previous-run.outputs.result }}
    steps:
      - name: Check for a successful run of this SHA
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return true;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-lsposed.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            return !runs.some((run) =>
              run.id !== context.runId && run.conclusion === 'success'
            );

  verify:
    needs: deduplicate
    if: needs.deduplicate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild merged Android application
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Xposed integration
        run: |
          test -f android/app/src/main/java/com/monkeycode/hook/ModuleMain.kt
          test -f android/app/src/main/java/com/monkeycode/hook/XposedServiceBridge.kt
          test -f android/app/src/main/resources/META-INF/xposed/java_init.list
          test -f android/app/src/main/resources/META-INF/xposed/module.prop
          test -f android/app/src/main/resources/META-INF/xposed/scope.list
          grep -F 'io.github.libxposed:api:102.0.0' android/app/build.gradle
          grep -F 'io.github.libxposed:service:102.0.0' android/app/build.gradle
          grep -F 'XposedServiceBridge.initialize(this)' android/app/src/main/java/com/chaitin/baizhi/monkeycode/MainApplication.kt
          grep -F 'android.minSdkVersion=26' android/gradle.properties

      - name: Compile merged application Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileReleaseKotlin --build-cache --no-daemon
